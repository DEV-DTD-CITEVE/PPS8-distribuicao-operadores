services:
  pps8-operators-webapp:
    image: pps8-operators-webapp:latest
    container_name: pps8-operators-webapp
    build:
      context: .
    restart: unless-stopped
    networks:
      - pps8-network

  pps8-nginx:
    image: nginx:alpine
    container_name: pps8-nginx
    restart: unless-stopped
    ports:
      - "8100:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - pps8-operators-webapp
    networks:
      - pps8-network

networks:
  pps8-network:
    driver: bridge
