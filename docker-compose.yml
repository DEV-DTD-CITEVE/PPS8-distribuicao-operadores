services:
  pps8-operators-webapp:
    image: pps8-operators-webapp:latest
    container_name: pps8-operators-webapp
    build:
      context: .
    restart: unless-stopped
    networks:
      - common_network
    labels:
      # 1. Ativar o Traefik para este container
      - "traefik.enable=true"
      # 2. Caminho público — deve coincidir com o `base` definido em vite.config.ts
      - "traefik.http.routers.pps8-operators-webapp.rule=PathPrefix(`/digitalforge`)"
      - "traefik.http.routers.pps8-operators-webapp.entrypoints=web"
      # 3. Porta INTERNA onde o container escuta
      - "traefik.http.services.pps8-operators-webapp.loadbalancer.server.port=3000"

networks:
  common_network:
    external: true
