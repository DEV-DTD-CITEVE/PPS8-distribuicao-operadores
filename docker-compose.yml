services:
  pps8-operators-webapp:
    container_name: digitalforce-web
    build:
      context: .
    image: pps8-operators-webapp:latest
    restart: always
    networks:
      - common_network

  pps8-nginx:
    container_name: digitalforce-nginx
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - pps8-operators-webapp
    networks:
      - common_network

networks:
  common_network:
    external: true
